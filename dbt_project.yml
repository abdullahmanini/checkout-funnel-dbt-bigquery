name: checkout_funnel
version: "1.0.0"
profile: checkout_funnel
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]

vars:
  # Events after this are dropped (the public dataset contains future-dated rows).
  as_of: "2026-11-01"
  experiment_start: "2026-08-03"
  experiment_end: "2026-09-27"
  experiment_salt: "guest-checkout-v1"
  # Simulated treatment effect: share of anonymous carts the guest checkout recovers.
  guest_recovery_rate: 0.12
  # Guest orders use a 10% welcome code.
  guest_discount: 0.10

models:
  checkout_funnel:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
